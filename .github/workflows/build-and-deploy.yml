name: Sestavení Web App (GitHub Pages) a Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # 1. Sestavení a publikace webové aplikace (Vite -> gh-pages branch)
  build-and-deploy-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4

      - name: Nastavení Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalace npm závislostí
        run: npm install --legacy-peer-deps

      - name: Sestavení produkční webové aplikace (Vite)
        run: npm run build

      - name: Publikace na GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true

  # 2. Sestavení nativního Android APK instalačního balíčku
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4

      - name: Nastavení Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Nastavení Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.9'
          cache: true

      - name: Příprava a oprava Android struktury
        run: |
          flutter config --no-analytics
          flutter create . --platforms=android --org cz.dochazka
          rm -f android/*.gradle.kts android/app/*.gradle.kts
          git checkout android/build.gradle
          git checkout android/settings.gradle
          git checkout android/app/build.gradle
          git checkout android/gradle.properties
          git checkout android/app/src/main/AndroidManifest.xml

      - name: Stažení Flutter balíčků
        run: flutter pub get

      - name: Sestavení Release APK balíčku
        run: |
          APP_VER="1.0.${{ github.run_number }}"
          flutter build apk --release --build-name="${APP_VER}" --build-number=${{ github.run_number }} --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/Dochazka-v${APP_VER}.apk"
          echo "APP_VER=${APP_VER}" >> $GITHUB_ENV

      - name: Uložení APK jako stahovatelný artefakt
        uses: actions/upload-artifact@v4
        with:
          name: dochazka-app-release-apk
          path: build/app/outputs/flutter-apk/Dochazka-v*.apk
          retention-days: 30

      - name: Vytvoření / Aktualizace GitHub Release s nejnovějším APK
        env:
          GH_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          # 1. Nahrajeme APK soubory do existujícího release 'latest'
          gh release upload latest \
            build/app/outputs/flutter-apk/Dochazka-v${{ env.APP_VER }}.apk \
            build/app/outputs/flutter-apk/app-release.apk \
            --clobber || true

          # 2. Vytvoříme nebo aktualizujeme release se specifickou verzí
          gh release create "v${{ env.APP_VER }}" \
            build/app/outputs/flutter-apk/Dochazka-v${{ env.APP_VER }}.apk \
            build/app/outputs/flutter-apk/app-release.apk \
            --title "Sestavení v${{ env.APP_VER }} (Web & Android APK)" \
            --notes "Automatické sestavení aplikace **Firemní Docházka a Evidence Zakázek** (v${{ env.APP_VER }})." \
            --latest || gh release upload "v${{ env.APP_VER }}" \
            build/app/outputs/flutter-apk/Dochazka-v${{ env.APP_VER }}.apk \
            build/app/outputs/flutter-apk/app-release.apk --clobber
