name: Sestavení Web App (GitHub Pages) a Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # 1. Sestavení a publikace webové aplikace (Vite -> gh-pages branch)
  build-and-deploy-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4

      - name: Nastavení Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalace npm závislostí
        run: npm install --legacy-peer-deps

      - name: Sestavení produkční webové aplikace (Vite)
        run: npm run build

      - name: Publikace na GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true

  # 2. Sestavení nativního Android APK instalačního balíčku
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4

      - name: Nastavení Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Nastavení Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Příprava Android struktury
        run: |
          flutter config --no-analytics
          git checkout android/app/build.gradle || true

      - name: Stažení Flutter balíčků
        run: flutter pub get

      - name: Sestavení Release APK balíčku
        run: |
          APP_VER="1.0.${{ github.run_number }}"
          flutter build apk --release --build-name="${APP_VER}" --build-number=${{ github.run_number }} --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/Dochazka-v${APP_VER}.apk"
          echo "APP_VER=${APP_VER}" >> $GITHUB_ENV

      - name: Uložení APK jako stahovatelný artefakt
        uses: actions/upload-artifact@v4
        with:
          name: dochazka-app-release-apk
          path: build/app/outputs/flutter-apk/Dochazka-v*.apk
          retention-days: 30

      - name: Vytvoření / Aktualizace GitHub Release s nejnovějším APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: "Nejnovější sestavení (Web & Android APK)"
          body: |
            Automatické sestavení aplikace **Firemní Docházka a Evidence Zakázek**.
            
            - 📱 **Android APK**: Stáhněte soubor `Dochazka-v${{ env.APP_VER }}.apk` (nebo `app-release.apk`) níže a nainstalujte do mobilu.
            - 🌐 **Web & iOS PWA**: Běží online přes GitHub Pages.
          files: |
            build/app/outputs/flutter-apk/Dochazka-v${{ env.APP_VER }}.apk
            build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || secrets.GITHUB_TOKEN }}
